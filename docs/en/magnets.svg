<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="magnets-title magnets-desc">
<title id="magnets-title">Magnet lookup with two sources</title>
<desc id="magnets-desc">For each due work StudyMovie reads magnets from the javdb.com movie page and falls back to sukebei; unreleased or recently checked works are skipped.</desc>
<defs>
  <marker id="magnetsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="muted"/></marker>
  <marker id="magnetsb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="acc"/></marker>
</defs>
<style>
  .bg{fill:#f5f5f4}.card{fill:#ffffff}.box{fill:#ffffff;stroke:#2d3142;stroke-opacity:.32}
  .focal{fill:#fbeee8;stroke:#bf4520;stroke-width:1.5}.dim{fill:#ecebe8;stroke:#2d3142;stroke-opacity:.18}
  .ink{fill:#2d3142}.muted{fill:#5b5f6b}.soft{fill:#7c808c}.acc{fill:#bf4520}
  .line{stroke:#5b5f6b;stroke-width:1.4;fill:none}.aline{stroke:#bf4520;stroke-width:1.8;fill:none}
  .dash{stroke-dasharray:5 4}.rule{stroke:#2d3142;stroke-opacity:.16;fill:none}
  .tag{fill:#2d3142;fill-opacity:.07}.tagacc{fill:#bf4520;fill-opacity:.14}.mask{fill:#f5f5f4}
  .cover{fill:#dcdad5}.cover2{fill:#c9c6bf}.ok{fill:#2f7d4f}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Noto Sans CJK SC",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .t{font-size:22px;font-weight:600}.n{font-size:15px;font-weight:600}.s{font-size:11.5px}.e{font-size:10.5px;letter-spacing:.08em}
  @media (prefers-color-scheme:dark){
    .bg,.mask{fill:#1d1f24}.card{fill:#262930}.box{fill:#262930;stroke:#e9e7e2;stroke-opacity:.30}
    .focal{fill:#3a2620;stroke:#ea7a52}.dim{fill:#2c2f36;stroke:#e9e7e2;stroke-opacity:.16}
    .ink{fill:#f2f0ea}.muted{fill:#b9bcc5}.soft{fill:#9599a5}.acc{fill:#ea7a52}
    .line{stroke:#b9bcc5}.aline{stroke:#ea7a52}.rule{stroke:#e9e7e2}.tag{fill:#e9e7e2}.tagacc{fill:#ea7a52}
    .cover{fill:#3a3d45}.cover2{fill:#464a53}.ok{fill:#5fbf85}
  }
</style>
<rect class="bg" width="1040" height="400" rx="12"/>
<text class="mono e soft" x="32" y="40">MAGNET SOURCES</text><text class="t ink" x="32" y="70">Two sources, checked only when a torrent is likely</text>
<path class="line" d="M172 148 H226" marker-end="url(#magnetsa)"/>
<path class="aline" d="M372 148 H426" marker-end="url(#magnetsb)"/>
<path class="aline" d="M602 136 H656" marker-end="url(#magnetsb)"/>
<path class="aline" d="M812 148 H866" marker-end="url(#magnetsb)"/>
<path class="line" d="M302 194 V242" marker-end="url(#magnetsa)"/>
<path class="line dash" d="M517 194 V242" marker-end="url(#magnetsa)"/>
<path class="line dash" d="M602 264 H624 Q632 264 632 256 V170 Q632 162 640 162 H656" marker-end="url(#magnetsa)"/>
<path class="line dash" d="M602 290 H656" marker-end="url(#magnetsa)"/>
<rect class="mask" x="383.235" y="125" width="31.53" height="16"/><text class="mono e muted" x="399" y="137" text-anchor="middle">DUE</text>
<rect class="mask" x="606.725" y="113" width="44.55" height="16"/><text class="mono e muted" x="629" y="125" text-anchor="middle">FOUND</text>
<rect class="mask" x="307" y="211" width="57.57" height="16"/><text class="mono e muted" x="312" y="223" text-anchor="start">NOT DUE</text>
<rect class="mask" x="522" y="211" width="90.12" height="16"/><text class="mono e muted" x="527" y="223" text-anchor="start">NONE / ERROR</text>
<rect class="box" x="32" y="116" width="140" height="78" rx="6"/>
<rect class="tag" x="44" y="126" width="36.04" height="16" rx="2"/>
<text class="mono e muted" x="48" y="138">POOL</text>
<text class="n ink" x="44" y="162">New work</text>
<text class="mono s soft" x="44" y="180">from the pool</text>
<rect class="box" x="232" y="116" width="140" height="78" rx="6"/>
<rect class="tag" x="244" y="126" width="36.04" height="16" rx="2"/>
<text class="mono e muted" x="248" y="138">RULE</text>
<text class="n ink" x="244" y="162">Due today?</text>
<text class="mono s soft" x="244" y="180">by release date</text>
<rect class="focal" x="432" y="116" width="170" height="78" rx="6"/>
<rect class="tagacc" x="444" y="126" width="55.57" height="16" rx="2"/>
<text class="mono e acc" x="448" y="138">PRIMARY</text>
<text class="n ink" x="444" y="162">javdb.com page</text>
<text class="mono s soft" x="444" y="180">~1.3 pages / sec</text>
<rect class="box" x="662" y="116" width="150" height="78" rx="6"/>
<rect class="tag" x="674" y="126" width="49.06" height="16" rx="2"/>
<text class="mono e muted" x="678" y="138">CHOOSE</text>
<text class="n ink" x="674" y="162">Pick the best</text>
<text class="mono s soft" x="674" y="180">full, smaller first</text>
<rect class="box" x="872" y="116" width="136" height="78" rx="6"/>
<rect class="tag" x="884" y="126" width="36.04" height="16" rx="2"/>
<text class="mono e muted" x="888" y="138">DONE</text>
<text class="n ink" x="884" y="162">Submit</text>
<text class="mono s soft" x="884" y="180">aria2 or Thunder</text>
<rect class="dim" x="232" y="248" width="140" height="78" rx="6"/>
<rect class="tag" x="244" y="258" width="36.04" height="16" rx="2"/>
<text class="mono e muted" x="248" y="270">SKIP</text>
<text class="n ink" x="244" y="294">Wait</text>
<text class="mono s soft" x="244" y="312">not checked today</text>
<rect class="box" x="432" y="248" width="170" height="78" rx="6"/>
<rect class="tag" x="444" y="258" width="62.08" height="16" rx="2"/>
<text class="mono e muted" x="448" y="270">FALLBACK</text>
<text class="n ink" x="444" y="294">sukebei RSS</text>
<text class="mono s soft" x="444" y="312">&lt; 1 request / sec</text>
<rect class="dim" x="662" y="248" width="150" height="78" rx="6"/>
<rect class="tag" x="674" y="258" width="42.55" height="16" rx="2"/>
<text class="mono e muted" x="678" y="270">LATER</text>
<text class="n ink" x="674" y="294">No torrent yet</text>
<text class="mono s soft" x="674" y="312">retry on schedule</text>
<line class="rule" x1="32" y1="350" x2="1008" y2="350"/>
<text class="mono s soft" x="32" y="376">Schedule: from 1 day before release, daily for 14 days, then weekly. Unreleased works are not queried.</text>
</svg>
